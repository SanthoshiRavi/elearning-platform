global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  #########################################################
  # Prometheus
  #########################################################

  - job_name: prometheus

    static_configs:
      - targets:
          - localhost:9090

  #########################################################
  # Monitoring EC2 (Node Exporter)
  #########################################################

  - job_name: monitoring-node

    static_configs:
      - targets:
          - 10.0.1.216:9100

  #########################################################
  # Frontend EC2 (Node Exporter)
  #########################################################

  - job_name: frontend-node

    static_configs:
      - targets:
          - 10.0.1.69:9100

  #########################################################
  # Backend EC2 (Node Exporter)
  #########################################################

  - job_name: backend-node

    static_configs:
      - targets:
          - 10.0.1.130:9100

  #########################################################
  # Spring Boot Actuator Metrics
  #########################################################

  - job_name: backend-actuator

    metrics_path: /actuator/prometheus

    static_configs:
      - targets:
          - 10.0.1.130:8081