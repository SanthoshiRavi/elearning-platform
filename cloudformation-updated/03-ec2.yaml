AWSTemplateFormatVersion: '2010-09-09'

Description: EC2 Infrastructure for E-Learning Platform

Parameters:

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 Key Pair
    Default: ec2key

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id

  VpcId:
    Type: AWS::EC2::VPC::Id

  AdminIpCidr:
    Type: String
    Description: Your IP address (CIDR) allowed to SSH and access monitoring dashboards
    Default: 0.0.0.0/0

  JenkinsSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing Security Group used by the Jenkins server

Resources:

  #########################################################
  # SECURITY GROUPS
  #########################################################

  SSHSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription: Security Group for SSH access

      VpcId: !Ref VpcId

      SecurityGroupIngress:

        - Description: SSH Access
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminIpCidr

      Tags:

        - Key: Name
          Value: elearning-ssh-sg

        - Key: Project
          Value: elearning-platform

  FrontendSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription: Security Group for Frontend EC2

      VpcId: !Ref VpcId

      SecurityGroupIngress:

        - Description: HTTP Access
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

        - Description: HTTPS Access
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

      Tags:

        - Key: Name
          Value: elearning-frontend-sg

        - Key: Project
          Value: elearning-platform

  BackendSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription: Security Group for Backend EC2

      VpcId: !Ref VpcId

      SecurityGroupIngress:

        - Description: Spring Boot API
          IpProtocol: tcp
          FromPort: 8081
          ToPort: 8081
          SourceSecurityGroupId: !Ref FrontendSecurityGroup

        - Description: Prometheus Metrics
          IpProtocol: tcp
          FromPort: 8081
          ToPort: 8081
          SourceSecurityGroupId: !Ref MonitoringSecurityGroup

        - Description: Jenkins Health Check
          IpProtocol: tcp
          FromPort: 8081
          ToPort: 8081
          SourceSecurityGroupId: !Ref JenkinsSecurityGroup

      Tags:

        - Key: Name
          Value: elearning-backend-sg

        - Key: Project
          Value: elearning-platform

  MonitoringSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription: Security Group for Monitoring EC2 (Prometheus/Grafana)

      VpcId: !Ref VpcId

      SecurityGroupIngress:

        - Description: Grafana Dashboard
          IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref AdminIpCidr

        - Description: Prometheus UI
          IpProtocol: tcp
          FromPort: 9090
          ToPort: 9090
          CidrIp: !Ref AdminIpCidr

      Tags:

        - Key: Name
          Value: elearning-monitoring-sg

        - Key: Project
          Value: elearning-platform

  #########################################################
  # NODE EXPORTER INGRESS (added after SGs exist, avoids circular refs)
  #########################################################

  FrontendNodeExporterIngress:

    Type: AWS::EC2::SecurityGroupIngress

    Properties:

      Description: Node Exporter metrics from Monitoring
      GroupId: !Ref FrontendSecurityGroup
      IpProtocol: tcp
      FromPort: 9100
      ToPort: 9100
      SourceSecurityGroupId: !Ref MonitoringSecurityGroup

  BackendNodeExporterIngress:

    Type: AWS::EC2::SecurityGroupIngress

    Properties:

      Description: Node Exporter metrics from Monitoring
      GroupId: !Ref BackendSecurityGroup
      IpProtocol: tcp
      FromPort: 9100
      ToPort: 9100
      SourceSecurityGroupId: !Ref MonitoringSecurityGroup

  #########################################################
  # IAM ROLE
  #########################################################

  EC2Role:

    Type: AWS::IAM::Role

    Properties:

      RoleName: elearning-ec2-role

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  #########################################################
  # INSTANCE PROFILE
  #########################################################

  EC2InstanceProfile:

    Type: AWS::IAM::InstanceProfile

    Properties:

      Roles:

        - !Ref EC2Role

  #########################################################
  # FRONTEND EC2
  #########################################################

  FrontendEC2:

    Type: AWS::EC2::Instance

    Properties:

      InstanceType: t3.micro

      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"

      KeyName: !Ref KeyPairName

      SubnetId: !Ref PublicSubnetId

      IamInstanceProfile: !Ref EC2InstanceProfile

      SecurityGroupIds:

        - !Ref FrontendSecurityGroup

        - !Ref SSHSecurityGroup

      Tags:

        - Key: Name
          Value: elearning-frontend

        - Key: Project
          Value: elearning-platform

        - Key: Environment
          Value: Development

      UserData:

        Fn::Base64: |
          #!/bin/bash
          set -eux

          dnf update -y

          dnf install -y \
            docker \
            git \
            awscli

          systemctl enable docker
          systemctl start docker

          usermod -aG docker ec2-user

          mkdir -p /usr/libexec/docker/cli-plugins
          curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" \
            -o /usr/libexec/docker/cli-plugins/docker-compose
          chmod +x /usr/libexec/docker/cli-plugins/docker-compose

  #########################################################
  # BACKEND EC2
  #########################################################

  BackendEC2:

    Type: AWS::EC2::Instance

    Properties:

      InstanceType: t3.micro

      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"

      KeyName: !Ref KeyPairName

      SubnetId: !Ref PublicSubnetId

      IamInstanceProfile: !Ref EC2InstanceProfile

      SecurityGroupIds:

        - !Ref BackendSecurityGroup

        - !Ref SSHSecurityGroup

      Tags:

        - Key: Name
          Value: elearning-backend

        - Key: Project
          Value: elearning-platform

        - Key: Environment
          Value: Development

      UserData:

        Fn::Base64: |
          #!/bin/bash
          set -eux

          dnf update -y

          dnf install -y \
            docker \
            git \
            awscli \
            java-21-amazon-corretto

          systemctl enable docker
          systemctl start docker

          usermod -aG docker ec2-user

          mkdir -p /usr/libexec/docker/cli-plugins
          curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" \
            -o /usr/libexec/docker/cli-plugins/docker-compose
          chmod +x /usr/libexec/docker/cli-plugins/docker-compose

  #########################################################
  # MONITORING EC2
  #########################################################

  MonitoringEC2:

    Type: AWS::EC2::Instance

    Properties:

      InstanceType: t3.micro

      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"

      KeyName: !Ref KeyPairName

      SubnetId: !Ref PublicSubnetId

      IamInstanceProfile: !Ref EC2InstanceProfile

      SecurityGroupIds:

        - !Ref MonitoringSecurityGroup

        - !Ref SSHSecurityGroup

      Tags:

        - Key: Name
          Value: elearning-monitoring

        - Key: Project
          Value: elearning-platform

        - Key: Environment
          Value: Development

      UserData:

        Fn::Base64: |
          #!/bin/bash
          set -eux

          dnf update -y

          dnf install -y \
            docker \
            git \
            awscli \
            java-21-amazon-corretto

          systemctl enable docker
          systemctl start docker

          usermod -aG docker ec2-user

          mkdir -p /usr/libexec/docker/cli-plugins

          curl -SL \
          https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m) \
          -o /usr/libexec/docker/cli-plugins/docker-compose

          chmod +x /usr/libexec/docker/cli-plugins/docker-compose
  #########################################################
  # SSM Parameters
  #########################################################
  FrontendPrivateIPParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /elearning/infrastructure/frontend-private-ip
      Type: String
      Value: !GetAtt FrontendEC2.PrivateIp
      Description: Frontend EC2 Private IP
  BackendPrivateIPParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /elearning/infrastructure/backend-private-ip
      Type: String
      Value: !GetAtt BackendEC2.PrivateIp
      Description: Backend EC2 Private IP
  MonitoringPrivateIPParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /elearning/infrastructure/monitoring-private-ip
      Type: String
      Value: !GetAtt MonitoringEC2.PrivateIp
      Description: Monitoring EC2 Private IP
  #########################################################
  # FRONTEND ELASTIC IP
  #########################################################

  FrontendElasticIP:

    Type: AWS::EC2::EIP

    Properties:

      Domain: vpc

      Tags:

        - Key: Name
          Value: elearning-frontend-eip

        - Key: Project
          Value: elearning-platform

  FrontendElasticIPAssociation:

    Type: AWS::EC2::EIPAssociation

    Properties:

      AllocationId: !GetAtt FrontendElasticIP.AllocationId

      InstanceId: !Ref FrontendEC2

  #########################################################
  # MONITORING ELASTIC IP
  #########################################################

  MonitoringElasticIP:

    Type: AWS::EC2::EIP

    Properties:

      Domain: vpc

      Tags:

        - Key: Name
          Value: elearning-monitoring-eip

        - Key: Project
          Value: elearning-platform

  MonitoringElasticIPAssociation:

    Type: AWS::EC2::EIPAssociation

    Properties:

      AllocationId: !GetAtt MonitoringElasticIP.AllocationId

      InstanceId: !Ref MonitoringEC2

#########################################################
# OUTPUTS
#########################################################

Outputs:

  FrontendInstanceId:

    Description: Frontend EC2 Instance ID

    Value: !Ref FrontendEC2

  BackendInstanceId:

    Description: Backend EC2 Instance ID

    Value: !Ref BackendEC2

  FrontendPrivateIP:

    Description: Frontend Private IP

    Value: !GetAtt FrontendEC2.PrivateIp

  BackendPrivateIP:

    Description: Backend Private IP

    Value: !GetAtt BackendEC2.PrivateIp

  FrontendElasticIP:

    Description: Frontend Elastic IP

    Value: !Ref FrontendElasticIP

  MonitoringInstanceId:

    Description: Monitoring EC2 Instance ID

    Value: !Ref MonitoringEC2

  MonitoringPrivateIP:

    Description: Monitoring Private IP

    Value: !GetAtt MonitoringEC2.PrivateIp

  MonitoringElasticIP:

    Description: Monitoring Elastic IP

    Value: !Ref MonitoringElasticIP

  FrontendSecurityGroupId:

    Description: Frontend Security Group ID

    Value: !Ref FrontendSecurityGroup

  BackendSecurityGroupId:

    Description: Backend Security Group ID

    Value: !Ref BackendSecurityGroup

  MonitoringSecurityGroupId:

    Description: Monitoring Security Group ID

    Value: !Ref MonitoringSecurityGroup

  SSHSecurityGroupId:

    Description: SSH Security Group ID

    Value: !Ref SSHSecurityGroup

  FrontendPrivateIPParameterName:

    Description: SSM Parameter containing Frontend Private IP

    Value: !Ref FrontendPrivateIPParameter

  BackendPrivateIPParameterName:

    Description: SSM Parameter containing Backend Private IP

    Value: !Ref BackendPrivateIPParameter

  MonitoringPrivateIPParameterName:

    Description: SSM Parameter containing Monitoring Private IP

    Value: !Ref MonitoringPrivateIPParameter